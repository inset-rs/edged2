name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install nightly-2026-09-02 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test core and platform crates
        run: cargo test --workspace --exclude edged --locked
      - name: Compile interface tests
        run: cargo test -p edged --no-run --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
