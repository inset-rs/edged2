[package]
name = "edged"
description = "The windows and applications of the desktop, on a panel at its edge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The app is the library; the binary calls its `main`. A macOS-only app links no dylib.
[lib]
crate-type = ["rlib"]

[[bin]]
name = "edged"
path = "src/main.rs"

[dependencies]
edged-core.workspace = true
edged-macos.workspace = true
inset.workspace = true
inset-animation.workspace = true
# The preview names its host: the picture's buffer becomes a texture on the host's device.
inset-embedder-winit.workspace = true
inset-rendering.workspace = true
inset-winui.workspace = true
valo-codec-apple.workspace = true

[package.metadata.inset]
identifier = "app.edged2"
name = "Edged"
icon = "assets/icon.png"

[package.metadata.inset.macos]
# No Dock tile and no menu bar: the panel is the whole interface.
background_app = true

[lints]
workspace = true

[dev-dependencies]
inset-embedder = "0.4.0"
inset-foundation.workspace = true
inset-gestures = "0.4.0"
inset-painting = "0.4.0"
inset-scheduler = "0.4.0"
inset-widgets = "0.4.0"
inset-test = "0.4.0"
wgpu = "30"
pollster = "0.4"
png = "0.17"
